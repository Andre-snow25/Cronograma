<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma PC SP 2026 - Nuvem</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui}
.fade{animation:f .3s}
@keyframes f{from{opacity:0}to{opacity:1}}
.tab-active{border-bottom:3px solid #4f46e5;color:#4f46e5}
textarea{resize:vertical;min-height:60px}
.sync-indicator{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
<div id="n" class="fixed top-4 right-4 z-50"></div>
<div id="sync-status" class="fixed top-4 left-4 z-50"></div>
<div id="app" class="max-w-7xl mx-auto"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD2d9bFtE-29MegN1xG9NOf776Rx8Lfgrs",
  authDomain: "cronograma-d352c.firebaseapp.com",
  projectId: "cronograma-d352c",
  storageBucket: "cronograma-d352c.firebasestorage.app",
  messagingSenderId: "1035295977614",
  appId: "1:1035295977614:web:e4ef9bfd959470f0b759df"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userId = localStorage.getItem('userId');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('userId', userId);
}

// Estado: agora cron é por MATÉRIA, não por dia
// cron: [{ id, ma, aulasTotal, aulasConcluidas, concluido }]
let e={aba:'plano',dias:[],revs:[],stats:{a:0,d:0,r:0},cron:[],titulos:{},dataReprogramacao:null};
let syncEnabled = true;
let isLoading = true;

const mat={
'Direito Penal – Parte Geral':53,
'Direito Penal – Parte Especial':151,
'Direito Processual Penal':53,
'Legislação Penal Especial':168,
'Direito Constitucional':45,
'Criminologia':52,
'Princípios Constitucionais':30,
'Direitos Humanos':48,
'Controle de Constitucionalidade':25,
'Direito Penal Militar':35,
'Execução Penal':40,
'Tribunal do Júri':28,
'Lei de Drogas':20,
'Português':81,
'Raciocínio Lógico':101,
'Raciocínio Lógico (Matemático)':80,
'Informática':160,
'Informática (Teoria e Exercícios)':70,
'Matemática':90
};

function showSyncStatus(msg, type='info') {
  const colors = {info:'bg-blue-500',success:'bg-green-500',error:'bg-red-500',syncing:'bg-yellow-500'};
  const icons = {info:'☁️',success:'✅',error:'❌',syncing:'🔄'};
  document.getElementById('sync-status').innerHTML = `
    <div class="${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 ${type==='syncing'?'sync-indicator':''}">
      <span>${icons[type]}</span><span class="text-sm font-medium">${msg}</span>
    </div>`;
  if(type!=='syncing') setTimeout(()=>{document.getElementById('sync-status').innerHTML='';},3000);
}

async function saveToCloud() {
  if(!syncEnabled) return;
  try {
    showSyncStatus('Sincronizando...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    await setDoc(docRef,{...e,lastUpdated:new Date().toISOString()});
    showSyncStatus('Salvo na nuvem!','success');
  } catch(error) {
    console.error('Erro ao salvar:',error);
    showSyncStatus('Erro ao sincronizar','error');
  }
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

async function loadFromCloud() {
  try {
    showSyncStatus('Carregando da nuvem...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    const docSnap = await getDoc(docRef);
    if(docSnap.exists()) {
      const data = docSnap.data();
      e = {...e,...data};
      if(!e.titulos) e.titulos={};
      if(!e.dataReprogramacao) e.dataReprogramacao=null;
      if(!e.cron.length) gen();
      showSyncStatus('Carregado da nuvem!','success');
    } else {
      gen();
      await saveToCloud();
    }
    isLoading=false;
    rend();
    setupRealtimeSync();
  } catch(error) {
    console.error('Erro ao carregar:',error);
    showSyncStatus('Erro ao carregar','error');
    ld();
    isLoading=false;
    rend();
  }
}

function setupRealtimeSync() {
  const docRef = doc(db,'cronogramas',userId);
  onSnapshot(docRef,(snap)=>{
    if(snap.exists()&&!isLoading){
      const data=snap.data();
      const currentUpdate=e.lastUpdated||'';
      const cloudUpdate=data.lastUpdated||'';
      if(cloudUpdate>currentUpdate){
        e={...e,...data};
        rend();
        ntf('🔄 Atualizado de outro dispositivo!');
      }
    }
  });
}

function sv(){
  saveToCloud();
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

function ld(){
  try{
    const s=localStorage.getItem('cron2');
    if(s) e={...e,...JSON.parse(s)};
    if(!e.titulos) e.titulos={};
    if(!e.dataReprogramacao) e.dataReprogramacao=null;
  }catch{}
  if(!e.cron.length) gen();
}

// Gera cronograma: 1 item por MATÉRIA (não por dia)
function gen(){
  e.cron = Object.entries(mat).map(([ma,total],i)=>({
    id: 'c'+i,
    ma: ma,
    aulasTotal: total,
    aulasConcluidas: 0,
    concluido: false
  }));
  sv();
}

function ntf(msg,tp='ok'){
  const cor={ok:'bg-green-500',er:'bg-red-500',warn:'bg-yellow-500'};
  const dv=document.createElement('div');
  dv.className=`${cor[tp]} text-white px-6 py-3 rounded-lg shadow-lg mb-2`;
  dv.textContent=msg;
  document.getElementById('n').appendChild(dv);
  setTimeout(()=>dv.remove(),3000);
}

function dt(ds){
  const h=new Date();
  h.setDate(h.getDate()+ds);
  return h.toLocaleDateString('pt-BR');
}

// Registrar aulas estudadas numa matéria
function registrarAulas(id){
  const item = e.cron.find(c=>c.id===id);
  if(!item) return;
  const restante = item.aulasTotal - item.aulasConcluidas;
  const qtdStr = prompt(`📚 ${item.ma}\n\nTotal: ${item.aulasTotal} aulas\nConcluídas: ${item.aulasConcluidas}\nRestantes: ${restante}\n\nQuantas aulas você estudou hoje?`);
  if(qtdStr===null) return; // cancelou
  const qtd = parseInt(qtdStr);
  if(!qtd || qtd<=0){ntf('❌ Quantidade inválida','er');return;}
  const real = Math.min(qtd, restante);
  const de = item.aulasConcluidas+1;
  const ate = item.aulasConcluidas+real;
  item.aulasConcluidas += real;
  if(item.aulasConcluidas>=item.aulasTotal) item.concluido=true;
  e.stats.a += real;
  e.stats.d++;
  // Gera registro no histórico (dias)
  const ds={id:Date.now(),dt:new Date().toLocaleDateString('pt-BR'),ma:item.ma,i:de,f:ate,q:real,titulo:''};
  e.dias.push(ds);
  // Gera revisões
  [{t:'7d',ds:7,cor:'amber'},{t:'14d',ds:14,cor:'orange'},{t:'30d',ds:30,cor:'purple'},{t:'60d',ds:60,cor:'blue'}].forEach(r=>{
    e.revs.push({id:`${ds.id}-${r.t}`,di:ds.id,ma:item.ma,i:de,f:ate,q:real,titulo:'',dr:dt(r.ds),t:r.t,s:'p',cor:r.cor});
  });
  sv();rend();
  ntf(`🎉 +${real} aulas em ${item.ma}!`);
}

function mkR(id){
  const r=e.revs.find(x=>x.id===id);
  if(r){r.s='c';e.stats.r++;sv();rend();ntf('✅ Revisão OK!');}
}

function editData(id){
  const r=e.revs.find(x=>x.id===id);
  if(!r) return;
  const novaData=prompt('📅 Nova data da revisão (dd/mm/aaaa):',r.dr);
  if(novaData&&/^\d{2}\/\d{2}\/\d{4}$/.test(novaData)){
    r.dr=novaData;sv();rend();ntf('📅 Data atualizada!');
  }else if(novaData){
    ntf('❌ Formato inválido! Use dd/mm/aaaa','er');
  }
}

function exp(){
  const b=new Blob([JSON.stringify(e,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=`backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();URL.revokeObjectURL(u);ntf('💾 Exportado!');
}

function imp(ev){
  const f=ev.target.files[0];if(!f) return;
  const r=new FileReader();
  r.onload=x=>{
    try{
      e={...e,...JSON.parse(x.target.result)};
      if(!e.titulos)e.titulos={};
      if(!e.dataReprogramacao)e.dataReprogramacao=null;
      sv();rend();ntf('📥 Importado!');
    }catch{ntf('❌ Erro','er');}
  };
  r.readAsText(f);
}

function rst(){
  if(confirm('⚠️ Resetar tudo? Isto apagará os dados da nuvem também!')){
    saveToCloud().then(()=>{localStorage.removeItem('cron2');location.reload();});
  }
}

function showUserId(){
  const newId=prompt('🆔 Seu ID de usuário (copie para usar em outro dispositivo):',userId);
  if(newId&&newId!==userId&&confirm('Deseja trocar para este ID? Isso carregará os dados desse usuário.')){
    userId=newId;
    localStorage.setItem('userId',userId);
    location.reload();
  }
}

function rend(){
  const pd=e.revs.filter(x=>x.s==='p').length;
  const ta=Object.values(mat).reduce((s,v)=>s+v,0);
  const pg=(e.stats.a/ta*100).toFixed(1);

  const pendentes = e.cron.filter(c=>!c.concluido);
  const concluidas = e.cron.filter(c=>c.concluido);

  document.getElementById('app').innerHTML=`
<div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
<div class="flex justify-between items-start gap-4 mb-6 flex-wrap">
<div>
  <h1 class="text-3xl font-bold">📚 Cronograma PC SP 2026</h1>
  <p class="text-gray-600">Sistema de Revisão Espaçada com Nuvem ☁️</p>
  <button onclick="showUserId()" class="text-xs text-blue-600 hover:underline mt-1">🆔 ID: ${userId.substr(0,12)}...</button>
</div>
<div class="flex gap-2 flex-wrap">
<button onclick="exp()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-sm font-medium">💾 Exportar</button>
<label class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 text-sm font-medium cursor-pointer">📥 Importar<input type="file" accept=".json" onchange="imp(event)" class="hidden"></label>
<button onclick="rst()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 text-sm font-medium">🔄 Resetar</button>
</div>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<div class="bg-gradient-to-br from-indigo-100 to-indigo-200 p-4 rounded-xl"><p class="text-sm font-bold text-indigo-900 mb-1">📚 Aulas</p><p class="text-3xl font-bold text-indigo-700">${e.stats.a}</p><p class="text-xs text-indigo-600">de ${ta}</p></div>
<div class="bg-gradient-to-br from-green-100 to-green-200 p-4 rounded-xl"><p class="text-sm font-bold text-green-900 mb-1">📖 Matérias</p><p class="text-3xl font-bold text-green-700">${concluidas.length}</p><p class="text-xs text-green-600">de ${e.cron.length} concluídas</p></div>
<div class="bg-gradient-to-br from-purple-100 to-purple-200 p-4 rounded-xl"><p class="text-sm font-bold text-purple-900 mb-1">📊 Progresso</p><p class="text-3xl font-bold text-purple-700">${pg}%</p></div>
<div class="bg-gradient-to-br from-orange-100 to-orange-200 p-4 rounded-xl"><p class="text-sm font-bold text-orange-900 mb-1">🔔 Revisões</p><p class="text-3xl font-bold text-orange-700">${pd}</p><p class="text-xs text-orange-600">${e.stats.r} completas</p></div>
</div>
</div>

<div class="bg-white rounded-t-2xl shadow-xl">
<div class="flex border-b overflow-x-auto">
<button onclick="e.aba='plano';rend()" class="flex-1 px-6 py-4 font-bold whitespace-nowrap ${e.aba==='plano'?'tab-active':'text-gray-600 hover:text-gray-800'}">📋 Plano</button>
<button onclick="e.aba='revs';rend()" class="flex-1 px-6 py-4 font-bold whitespace-nowrap relative ${e.aba==='revs'?'tab-active':'text-gray-600 hover:text-gray-800'}">🔄 Revisões${pd>0?`<span class="absolute top-2 right-2 bg-orange-500 text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center animate-pulse">${pd}</span>`:''}</button>
</div>
</div>

<div class="bg-white rounded-b-2xl shadow-xl p-6 mb-6">

${e.aba==='plano'?`
<h2 class="text-2xl font-bold mb-6">📋 Plano de Estudo</h2>

<!-- PENDENTES -->
<div class="mb-10">
<h3 class="text-xl font-bold text-yellow-700 mb-4">⏳ Pendentes (${pendentes.length})</h3>
<div class="grid md:grid-cols-2 gap-3">
${pendentes.map(c=>{
  const pct = Math.round(c.aulasConcluidas/c.aulasTotal*100);
  return `<div class="border-2 border-yellow-300 bg-yellow-50 rounded-xl p-4 hover:shadow-lg transition-all">
  <div class="flex justify-between items-start gap-3 mb-3">
    <div class="flex-1 min-w-0">
      <h4 class="font-bold text-gray-800 break-words mb-1">${c.ma}</h4>
      <div class="flex gap-2 text-xs flex-wrap">
        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold">📚 ${c.aulasTotal} aulas</span>
        <span class="bg-green-100 text-green-700 px-2 py-1 rounded">✅ ${c.aulasConcluidas} feitas</span>
        <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded">⏳ ${c.aulasTotal-c.aulasConcluidas} restantes</span>
      </div>
    </div>
    <button onclick="registrarAulas('${c.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap flex-shrink-0 shadow-md">+ Estudei</button>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-2">
    <div class="bg-indigo-500 h-2 rounded-full transition-all" style="width:${pct}%"></div>
  </div>
  <p class="text-xs text-gray-400 mt-1">${pct}% concluído</p>
</div>`;
}).join('')}
</div>
</div>

<!-- FINALIZADAS -->
${concluidas.length>0?`
<details>
<summary class="text-xl font-bold text-green-700 mb-4 cursor-pointer list-none select-none">✅ Finalizadas (${concluidas.length}) ▼</summary>
<div class="grid md:grid-cols-2 gap-3 mt-4">
${concluidas.map(c=>`
<div class="border-2 border-green-300 bg-green-50 rounded-xl p-4">
  <div class="flex justify-between items-start gap-3">
    <div class="flex-1 min-w-0">
      <h4 class="font-bold text-gray-800 line-through opacity-60 break-words mb-1">${c.ma}</h4>
      <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">📚 ${c.aulasTotal} aulas</span>
    </div>
    <span class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex-shrink-0">✓ Feito</span>
  </div>
</div>`).join('')}
</div>
</details>`:''}
`:''}

${e.aba==='revs'?`<div><h2 class="text-2xl font-bold mb-4">🔄 Revisões por Data</h2>${e.revs.length===0?'<div class="text-center py-16 bg-gray-50 rounded-xl"><span class="text-6xl block mb-3">🔄</span><p class="text-gray-500 text-lg">Nenhuma revisão ainda</p><p class="text-gray-400 text-sm mt-2">Complete aulas no Plano!</p></div>':`<div class="mb-8"><h3 class="text-lg font-bold text-orange-900 mb-4 flex items-center gap-2"><span class="text-2xl">⏰</span>Pendentes (${e.revs.filter(x=>x.s==='p').length})</h3>${e.revs.filter(x=>x.s==='p').length===0?'<p class="text-gray-500 text-center py-8 bg-gray-50 rounded-lg">Nenhuma revisão pendente!</p>':`<div class="space-y-3">${e.revs.filter(x=>x.s==='p').sort((a,b)=>a.dr.split('/').reverse().join('').localeCompare(b.dr.split('/').reverse().join(''))).map(r=>`<div class="border-l-4 border-${r.cor}-500 bg-white rounded-xl p-5 hover:shadow-xl transition-all"><div class="flex flex-col md:flex-row justify-between gap-4"><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-2"><span class="text-2xl">📅</span><strong class="text-xl">${r.dr}</strong><button onclick="editData('${r.id}')" class="ml-2 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded" title="Editar data">✏️</button></div><h4 class="font-bold text-lg mb-2 break-words">${r.ma}</h4><div class="flex gap-2 flex-wrap text-xs mb-3"><span class="bg-${r.cor}-100 text-${r.cor}-700 px-3 py-1 rounded-lg font-bold">${r.t}</span><span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded">Aulas ${r.i}-${r.f}</span><span class="bg-gray-100 text-gray-700 px-3 py-1 rounded">${r.q} aulas</span></div></div><button onclick="mkR('${r.id}')" class="bg-gradient-to-r from-${r.cor}-500 to-${r.cor}-600 text-white px-6 py-3 rounded-lg hover:shadow-lg font-bold whitespace-nowrap flex-shrink-0">✓ Revisei</button></div></div>`).join('')}</div>`}</div>${e.revs.filter(x=>x.s==='c').length>0?`<div><h3 class="text-lg font-bold text-green-900 mb-4 flex items-center gap-2"><span class="text-2xl">✅</span>Completas (${e.revs.filter(x=>x.s==='c').length})</h3><div class="max-h-80 overflow-y-auto space-y-2">${e.revs.filter(x=>x.s==='c').sort((a,b)=>b.dr.split('/').reverse().join('').localeCompare(a.dr.split('/').reverse().join(''))).map(r=>`<div class="border-l-4 border-green-500 bg-green-50 rounded-xl p-4 opacity-75"><div class="flex items-center gap-2 mb-1"><span>📅</span><strong>${r.dr}</strong></div><h4 class="font-bold line-through text-gray-700">${r.ma}</h4><div class="flex gap-2 text-xs mt-2"><span class="bg-gray-100 px-2 py-1 rounded">Aulas ${r.i}-${r.f}</span><span class="bg-green-100 text-green-700 px-2 py-1 rounded">${r.t}</span></div></div>`).join('')}</div></div>`:''}`}</div>`:''}

</div>`;

  window.registrarAulas = registrarAulas;
  window.mkR = mkR;
  window.editData = editData;
  window.exp = exp;
  window.imp = imp;
  window.rst = rst;
  window.showUserId = showUserId;
  window.e = e;
  window.rend = rend;
}

loadFromCloud();
</script>
</body>
</html>
