<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma PC SP 2026 - Nuvem</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui}
.fade{animation:f .3s}
@keyframes f{from{opacity:0}to{opacity:1}}
.tab-active{border-bottom:3px solid #4f46e5;color:#4f46e5}

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
<div id="n" class="fixed top-4 right-4 z-50"></div>
<div id="modal-root"></div>
<style>
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;}

</style>
<div id="sync-status" class="fixed top-4 left-4 z-50"></div>
<div id="app" class="max-w-7xl mx-auto"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD2d9bFtE-29MegN1xG9NOf776Rx8Lfgrs",
  authDomain: "cronograma-d352c.firebaseapp.com",
  projectId: "cronograma-d352c",
  storageBucket: "cronograma-d352c.firebasestorage.app",
  messagingSenderId: "1035295977614",
  appId: "1:1035295977614:web:e4ef9bfd959470f0b759df"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userId = localStorage.getItem('userId');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('userId', userId);
}

// ===== ESTADO =====
// Agora o app suporta MÚLTIPLOS CRONOGRAMAS (ex: Cronograma X, Cronograma Y),
// cada um com suas próprias matérias, revisões, questões, estatísticas e PDs (pomodoros) — tudo separado.
// e.cronogramas: [{ id, nome, cron:[], dias:[], revs:[], stats:{a,d,r}, titulos:{}, dataReprogramacao, questoes:[], pomodoros:[] }]
let e = { currentCronoId: null, aba: 'plano', cronogramas: [] };
let syncEnabled = true;
let isLoading = true;

function currentC(){
  return e.cronogramas.find(c => c.id === e.currentCronoId) || e.cronogramas[0];
}

function garantirCronogramaPadrao(){
  if(!e.cronogramas || e.cronogramas.length === 0){
    const c = novoCronogramaObj('Cronograma X');
    e.cronogramas = [c];
    e.currentCronoId = c.id;
  }
  if(!e.currentCronoId || !e.cronogramas.find(c=>c.id===e.currentCronoId)){
    e.currentCronoId = e.cronogramas[0].id;
  }
}

function novoCronogramaObj(nome){
  return {
    id: 'cr' + Date.now() + Math.random().toString(36).substr(2,4),
    nome,
    cron: [], dias: [], revs: [],
    stats: {a:0,d:0,r:0},
    titulos: {}, dataReprogramacao: null,
    questoes: [], pomodoros: []
  };
}

// Migra dados antigos (formato de 1 cronograma só) para o novo formato com múltiplos cronogramas
function migrar(data){
  if(data.cronogramas && data.cronogramas.length){
    e = data;
    e.cronogramas.forEach(c=>{
      if(!c.pomodoros) c.pomodoros=[];
      if(!c.titulos) c.titulos={};
      if(!c.questoes) c.questoes=[];
      if(c.dataReprogramacao===undefined) c.dataReprogramacao=null;
    });
    if(!e.aba) e.aba='plano';
    garantirCronogramaPadrao();
    return true;
  }
  if(data.cron){
    const legacy = {
      id: 'cr-legacy',
      nome: 'Cronograma X',
      cron: data.cron || [],
      dias: data.dias || [],
      revs: data.revs || [],
      stats: data.stats || {a:0,d:0,r:0},
      titulos: data.titulos || {},
      dataReprogramacao: data.dataReprogramacao || null,
      questoes: data.questoes || [],
      pomodoros: data.pomodoros || []
    };
    e = { currentCronoId: legacy.id, aba: data.aba || 'plano', cronogramas: [legacy] };
    return true;
  }
  return false;
}

function showSyncStatus(msg, type='info') {
  const colors = {info:'bg-blue-500',success:'bg-green-500',error:'bg-red-500',syncing:'bg-yellow-500'};
  const icons = {info:'☁️',success:'✅',error:'❌',syncing:'🔄'};
  document.getElementById('sync-status').innerHTML = `
    <div class="${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 ${type==='syncing'?'sync-indicator':''}">
      <span>${icons[type]}</span><span class="text-sm font-medium">${msg}</span>
    </div>`;
  if(type!=='syncing') setTimeout(()=>{document.getElementById('sync-status').innerHTML='';},3000);
}

async function saveToCloud() {
  if(!syncEnabled) return;
  try {
    showSyncStatus('Sincronizando...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    await setDoc(docRef,{...e,lastUpdated:new Date().toISOString()});
    showSyncStatus('Salvo na nuvem!','success');
  } catch(error) {
    console.error('Erro ao salvar:',error);
    showSyncStatus('Erro ao sincronizar','error');
  }
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

async function loadFromCloud() {
  try {
    showSyncStatus('Carregando da nuvem...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    const docSnap = await getDoc(docRef);
    if(docSnap.exists()) {
      const data = docSnap.data();
      if(!migrar(data)) garantirCronogramaPadrao();
      showSyncStatus('Carregado da nuvem!','success');
    } else {
      garantirCronogramaPadrao();
      await saveToCloud();
    }
    isLoading=false;
    rend();
    setupRealtimeSync();
  } catch(error) {
    console.error('Erro ao carregar:',error);
    showSyncStatus('Erro ao carregar','error');
    ld();
    isLoading=false;
    rend();
  }
}

function setupRealtimeSync() {
  const docRef = doc(db,'cronogramas',userId);
  onSnapshot(docRef,(snap)=>{
    if(snap.exists()&&!isLoading){
      const data=snap.data();
      const currentUpdate=e.lastUpdated||'';
      const cloudUpdate=data.lastUpdated||'';
      if(cloudUpdate>currentUpdate){
        migrar(data);
        rend();
        ntf('🔄 Atualizado de outro dispositivo!');
      }
    }
  });
}

function sv(){
  saveToCloud();
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

function ld(){
  try{
    const s=localStorage.getItem('cron2');
    if(s) migrar(JSON.parse(s));
  }catch{}
  garantirCronogramaPadrao();
}

function ntf(msg,tp='ok'){
  const cor={ok:'bg-green-500',er:'bg-red-500',warn:'bg-yellow-500'};
  const dv=document.createElement('div');
  dv.className=`${cor[tp]} text-white px-6 py-3 rounded-lg shadow-lg mb-2`;
  dv.textContent=msg;
  document.getElementById('n').appendChild(dv);
  setTimeout(()=>dv.remove(),3000);
}

// ===== CRONOGRAMAS (X, Y, ...) =====
function novoCronograma(){
  const sugestao = 'Cronograma ' + String.fromCharCode(88 + e.cronogramas.length); // X, Y, Z...
  const nome = prompt('Nome do novo cronograma:', sugestao);
  if(!nome) return;
  const c = novoCronogramaObj(nome);
  e.cronogramas.push(c);
  e.currentCronoId = c.id;
  sv();rend();
  ntf(`📁 ${nome} criado!`);
}
function renomearCronograma(){
  const c = currentC();
  const nome = prompt('Novo nome do cronograma:', c.nome);
  if(!nome) return;
  c.nome = nome; sv();rend();
}
function excluirCronograma(){
  if(e.cronogramas.length<=1){ntf('❌ Mantenha ao menos um cronograma','er');return;}
  if(!confirm(`Excluir "${currentC().nome}" e TODOS os seus dados (matérias, revisões, questões, PDs)? Isso não pode ser desfeito.`)) return;
  e.cronogramas = e.cronogramas.filter(c=>c.id!==e.currentCronoId);
  e.currentCronoId = e.cronogramas[0].id;
  sv();rend();
}
function trocarCronograma(id){
  e.currentCronoId = id;
  rend();
}

// ===== MATÉRIAS (por cronograma) =====
function addMateria(){
  const nomeEl = document.getElementById('nova-materia-nome');
  const aulasEl = document.getElementById('nova-materia-aulas');
  const nome = nomeEl.value.trim();
  const aulas = parseInt(aulasEl.value)||0;
  if(!nome || aulas<=0){ntf('❌ Informe o nome da matéria e a quantidade de aulas','er');return;}
  const c = currentC();
  c.cron.push({id:'m'+Date.now()+Math.random().toString(36).substr(2,4), ma:nome, aulasTotal:aulas, aulasConcluidas:0, concluido:false});
  nomeEl.value=''; aulasEl.value='';
  sv();rend();
  ntf(`✅ ${nome} adicionada ao ${c.nome}!`);
}
function delMateria(id){
  const c = currentC();
  const item = c.cron.find(x=>x.id===id);
  if(!item) return;
  if(!confirm(`Remover "${item.ma}" deste cronograma? O histórico de revisões e questões dessa matéria não será apagado.`)) return;
  c.cron = c.cron.filter(x=>x.id!==id);
  sv();rend();
}

// Helpers de data
function parseDMY(s){const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);}
function fmtDMY(d){return d.toLocaleDateString('pt-BR');}
function addDias(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

// Gera as 4 revisões respeitando máx 2/dia, a partir da data escolhida pelo usuário
function gerarRevisoes(dsId, ma, de, ate, qtd, data1, notas=''){
  const c = currentC();
  const intervalos=[
    {t:'7d',  dias:0,  cor:'amber'},
    {t:'14d', dias:7,  cor:'orange'},
    {t:'30d', dias:23, cor:'purple'},
    {t:'60d', dias:53, cor:'blue'}
  ];
  const cnt={};
  c.revs.filter(r=>r.s==='p').forEach(r=>{cnt[r.dr]=(cnt[r.dr]||0)+1;});

  intervalos.forEach(({t,dias,cor})=>{
    let d=addDias(data1,dias);
    for(let i=0;i<365;i++){
      const k=fmtDMY(d);
      if((cnt[k]||0)<2){
        cnt[k]=(cnt[k]||0)+1;
        c.revs.push({
          id:`${dsId}-${t}-${Math.random().toString(36).substr(2,4)}`,
          di:dsId,ma,i:de,f:ate,q:qtd,titulo:notas,dr:k,t,s:'p',cor
        });
        break;
      }
      d=addDias(d,1);
    }
  });
}

// Abre modal para registrar estudo
function registrarAulas(id){
  const c = currentC();
  const item = c.cron.find(x=>x.id===id);
  if(!item) return;
  const restante = item.aulasTotal - item.aulasConcluidas;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const sug = addDias(hoje,7);
  const sugISO = sug.getFullYear()+'-'+String(sug.getMonth()+1).padStart(2,'0')+'-'+String(sug.getDate()).padStart(2,'0');

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box fade">
        <h3 class="text-lg font-bold mb-1">📚 Registrar estudo</h3>
        <p class="text-sm text-gray-500 mb-4">${item.ma} <span class="text-gray-300">·</span> ${c.nome}</p>

        <label class="block text-sm font-semibold text-gray-700 mb-1">Quantas aulas você estudou?</label>
        <div class="flex items-center gap-3 mb-4">
          <input id="m-qtd" type="number" min="1" max="${restante}" value="1"
            class="w-24 border-2 border-gray-300 rounded-lg p-2 text-center text-xl font-bold focus:border-indigo-500 focus:outline-none">
          <span class="text-sm text-gray-400">de ${restante} restantes</span>
        </div>

        <label class="block text-sm font-semibold text-gray-700 mb-1">📅 Data da 1ª revisão</label>
        <input id="m-data1" type="date" value="${sugISO}"
          class="w-full border-2 border-gray-300 rounded-lg p-2 mb-1 focus:border-indigo-500 focus:outline-none">
        <p class="text-xs text-gray-400 mb-4">As demais revisões serão calculadas a partir desta data.</p>

        <label class="block text-sm font-semibold text-gray-700 mb-1">📝 Conteúdo estudado (opcional)</label>
        <textarea id="m-notas" placeholder="Ex: Art. 1 ao Art. 10 — Princípios do Direito Penal"
          class="w-full border-2 border-gray-300 rounded-lg p-2 mb-5 text-sm focus:border-indigo-500 focus:outline-none" rows="3"></textarea>

        <div class="flex gap-3">
          <button id="m-cancelar" class="flex-1 border-2 border-gray-200 text-gray-600 rounded-lg py-2.5 font-semibold hover:bg-gray-50">Cancelar</button>
          <button id="m-confirmar" class="flex-1 bg-indigo-600 text-white rounded-lg py-2.5 font-semibold hover:bg-indigo-700">Confirmar</button>
        </div>
      </div>
    </div>`;

  document.getElementById('m-cancelar').onclick = () => {
    document.getElementById('modal-root').innerHTML = '';
  };

  document.getElementById('m-confirmar').onclick = () => {
    const qtd = parseInt(document.getElementById('m-qtd').value)||0;
    const dataStr = document.getElementById('m-data1').value;
    if(!qtd||qtd<=0){ntf('❌ Informe a quantidade de aulas','er');return;}
    if(!dataStr){ntf('❌ Informe a data da 1ª revisão','er');return;}
    const real = Math.min(qtd, restante);
    const [y,m,d] = dataStr.split('-');
    const data1 = new Date(+y,+m-1,+d);
    const de = item.aulasConcluidas+1;
    const ate = item.aulasConcluidas+real;
    item.aulasConcluidas += real;
    if(item.aulasConcluidas>=item.aulasTotal) item.concluido=true;
    c.stats.a += real;
    c.stats.d++;
    const notas = document.getElementById('m-notas').value.trim();
    const ds={id:Date.now(),dt:new Date().toLocaleDateString('pt-BR'),ma:item.ma,i:de,f:ate,q:real,titulo:notas};
    c.dias.push(ds);
    gerarRevisoes(ds.id, item.ma, de, ate, real, data1, notas);
    document.getElementById('modal-root').innerHTML = '';
    sv();rend();
    ntf(`🎉 +${real} aulas em ${item.ma}!`);
  };
}

function mkR(id){
  const c = currentC();
  const r=c.revs.find(x=>x.id===id);
  if(r){r.s='c';c.stats.r++;sv();rend();ntf('✅ Revisão OK!');}
}

function editData(id){
  const c = currentC();
  const r=c.revs.find(x=>x.id===id);
  if(!r) return;
  const novaData=prompt('📅 Nova data da revisão (dd/mm/aaaa):',r.dr);
  if(novaData&&/^\d{2}\/\d{2}\/\d{4}$/.test(novaData)){
    r.dr=novaData;sv();rend();ntf('📅 Data atualizada!');
  }else if(novaData){
    ntf('❌ Formato inválido! Use dd/mm/aaaa','er');
  }
}

// ===== QUESTÕES =====

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box fade">
        <h3 class="text-lg font-bold mb-1">✍️ Registrar questões</h3>
        <p class="text-sm text-gray-500 mb-4">${ma}</p>

        <label class="block text-sm font-semibold text-gray-700 mb-1">Quantas questões você resolveu?</label>
        <input id="q-qtd" type="number" min="1" value="10"
          class="w-24 border-2 border-gray-300 rounded-lg p-2 text-center text-xl font-bold mb-4 focus:border-purple-500 focus:outline-none">

        <label class="block text-sm font-semibold text-gray-700 mb-1">📅 Data</label>
        <input id="q-data" type="date" value="${hojeISO}"
          class="w-full border-2 border-gray-300 rounded-lg p-2 mb-5 focus:border-purple-500 focus:outline-none">

        <div class="flex gap-3">
          <button id="q-cancelar" class="flex-1 border-2 border-gray-200 text-gray-600 rounded-lg py-2.5 font-semibold hover:bg-gray-50">Cancelar</button>
          <button id="q-confirmar" class="flex-1 bg-purple-600 text-white rounded-lg py-2.5 font-semibold hover:bg-purple-700">Confirmar</button>
        </div>
      </div>
    </div>`;

  document.getElementById('q-cancelar').onclick = () => {
    document.getElementById('modal-root').innerHTML = '';
  };

  document.getElementById('q-confirmar').onclick = () => {
    const qtd = parseInt(document.getElementById('q-qtd').value)||0;
    const dataStr = document.getElementById('q-data').value;
    if(!qtd||qtd<=0){ntf('❌ Informe a quantidade de questões','er');return;}
    if(!dataStr){ntf('❌ Informe a data','er');return;}
    const [y,m,d] = dataStr.split('-');
    const dataFmt = `${d}/${m}/${y}`;
    currentC().questoes.push({id:Date.now(),ma,data:dataFmt,qtd});
    document.getElementById('modal-root').innerHTML = '';
    sv();rend();
    ntf(`🎉 +${qtd} questões em ${ma}!`);
  };
}

function delQuestao(id){
  if(!confirm('Remover este registro?')) return;
  const c = currentC();
  c.questoes = c.questoes.filter(q=>q.id!==id);
  sv();rend();
  ntf('🗑️ Removido');
}

function diasAtras(n){
  const arr=[];
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--) arr.push(fmtDMY(addDias(hoje,-i)));
  return arr;
}

function questoesPorDia(n=14){
  const dias=diasAtras(n);
  const mapa={};
  currentC().questoes.forEach(q=>{mapa[q.data]=(mapa[q.data]||0)+q.qtd;});
  return dias.map(d=>({data:d,qtd:mapa[d]||0}));
}
function questoesHoje(){
  const hj=fmtDMY(new Date());
  return currentC().questoes.filter(q=>q.data===hj).reduce((s,q)=>s+q.qtd,0);
}
function questoesSemana(){
  const dias=diasAtras(7);
  return currentC().questoes.filter(q=>dias.includes(q.data)).reduce((s,q)=>s+q.qtd,0);
}
function questoesMes(){
  const dias=diasAtras(30);
  return currentC().questoes.filter(q=>dias.includes(q.data)).reduce((s,q)=>s+q.qtd,0);
}
function questoesTotal(){
  return currentC().questoes.reduce((s,q)=>s+q.qtd,0);
}
function mediaDiariaSemana(){
  return (questoesSemana()/7).toFixed(1);
}

// ===== PDs / POMODORO (por cronograma) =====
const POMO_DURACAO = 25*60;
let pomoSegundos = POMO_DURACAO;
let pomoRodando = false;
let pomoIntervalId = null;

function pomoFmt(s){
  const m=Math.floor(s/60).toString().padStart(2,'0');
  const ss=(s%60).toString().padStart(2,'0');
  return `${m}:${ss}`;
}
function pomoToggle(){
  if(pomoRodando){
    pomoRodando=false; clearInterval(pomoIntervalId);
  } else {
    pomoRodando=true;
    pomoIntervalId=setInterval(pomoTick,1000);
  }
  rend();
}
function pomoTick(){
  pomoSegundos--;
  const disp = document.getElementById('pomo-display');
  if(disp) disp.textContent = pomoFmt(pomoSegundos);
  if(pomoSegundos<=0){
    clearInterval(pomoIntervalId); pomoRodando=false;
    currentC().pomodoros.push({id:Date.now(), data: new Date().toLocaleDateString('pt-BR')});
    sv();
    pomoSegundos = POMO_DURACAO;
    rend();
    ntf('🍅 PD concluído! +25min registrados.');
  }
}
function pomoReset(){
  pomoRodando=false; clearInterval(pomoIntervalId);
  pomoSegundos = POMO_DURACAO;
  rend();
}

function pomodorosPorDia(n=14){
  const dias=diasAtras(n);
  const mapa={};
  currentC().pomodoros.forEach(p=>{mapa[p.data]=(mapa[p.data]||0)+1;});
  return dias.map(d=>({data:d,qtd:mapa[d]||0}));
}
function pomodorosHoje(){
  const hj=fmtDMY(new Date());
  return currentC().pomodoros.filter(p=>p.data===hj).length;
}
function pomodorosSemana(){
  const dias=diasAtras(7);
  return currentC().pomodoros.filter(p=>dias.includes(p.data)).length;
}
function pomodorosTotal(){
  return currentC().pomodoros.length;
}
function minutosSemana(){
  return pomodorosSemana()*25;
}

// Gráfico de barras (SVG) genérico
function svgBarChart(dados, color){
  const max=Math.max(...dados.map(d=>d.qtd),1);
  const w=760,h=190,padB=34,padT=20,padL=10,padR=10;
  const areaW=w-padL-padR;
  const bw=areaW/dados.length;
  const bars=dados.map((d,i)=>{
    const bh=max>0?(d.qtd/max)*(h-padT-padB):0;
    const x=padL+i*bw+bw*0.15;
    const bwReal=bw*0.7;
    const y=h-padB-bh;
    const [dd,mm]=d.data.split('/');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwReal.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"/>
    ${d.qtd>0?`<text x="${(x+bwReal/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="#374151" font-weight="bold">${d.qtd}</text>`:''}
    <text x="${(x+bwReal/2).toFixed(1)}" y="${h-padB+14}" font-size="9" text-anchor="middle" fill="#6b7280">${dd}/${mm}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">

function exp(){
  const b=new Blob([JSON.stringify(e,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=`backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();URL.revokeObjectURL(u);ntf('💾 Exportado!');
}

function imp(ev){
  const f=ev.target.files[0];if(!f) return;
  const r=new FileReader();
  r.onload=x=>{
    try{
      const data = JSON.parse(x.target.result);
      if(!migrar(data)) throw new Error('formato inválido');
      sv();rend();ntf('📥 Importado!');
    }catch{ntf('❌ Erro','er');}
  };
  r.readAsText(f);
}
