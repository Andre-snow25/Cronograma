let userId = null;

// ===== ESTADO =====
// Agora o app suporta MÚLTIPLOS CRONOGRAMAS (ex: Cronograma X, Cronograma Y),
// cada um com suas próprias matérias, revisões, questões, estatísticas e PDs (pomodoros) — tudo separado.
// e.cronogramas: [{ id, nome, cron:[], dias:[], revs:[], stats:{a,d,r}, titulos:{}, dataReprogramacao, questoes:[], pomodoros:[] }]
let e = { currentCronoId: null, aba: 'plano', cronogramas: [] };
let syncEnabled = true;
let isLoading = true;

function currentC(){
  return e.cronogramas.find(c => c.id === e.currentCronoId) || e.cronogramas[0];
}

function garantirCronogramaPadrao(){
  if(!e.cronogramas || e.cronogramas.length === 0){
    const c = novoCronogramaObj('Cronograma X');
    e.cronogramas = [c];
    e.currentCronoId = c.id;
  }
  if(!e.currentCronoId || !e.cronogramas.find(c=>c.id===e.currentCronoId)){
    e.currentCronoId = e.cronogramas[0].id;
  }
}

function novoCronogramaObj(nome){
  return {
    id: 'cr' + Date.now() + Math.random().toString(36).substr(2,4),
    nome,
    cron: [], dias: [], revs: [],
    stats: {a:0,d:0,r:0},
    titulos: {}, dataReprogramacao: null,
    questoes: [], pomodoros: [], analises: [],
    agenda: null, agendaConcluidos: {},
    rotina: rotinaPadrao()
  };
}

// Grade de rotina semanal (estilo planilha: dia x horário). As linhas (faixas
// de horário) se repetem toda semana, mas o CONTEÚDO de cada célula é por
// DATA real — cada semana tem seu próprio conteúdo, não fica repetindo.
// celulas: chave `${linhaId}|${DD/MM/AAAA}` -> texto.
// horasEstudo: chave `DD/MM/AAAA` -> valor.
function rotinaPadrao(){
  const linha = (horario) => ({ id:'rl'+Math.random().toString(36).substr(2,6), horario });
  return {
    linhas: [
      linha('07:00 - 08:00'),
      linha('08:00 - 12:00'),
      linha('12:00 - 12:30'),
      linha('12:30 - 13:00'),
      linha('13:00 - 18:00'),
      linha('18:00 - 19:00'),
      linha('19:00 - 22:00')
    ],
    celulas: {},
    horasEstudo: {}
  };
}
const DIAS_SEMANA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

// Converte o formato antigo da rotina (um único conteúdo fixo por dia da
// semana, repetido toda semana) pro formato novo por data — o que já tinha
// sido digitado passa a valer só pra semana atual, daqui pra frente cada
// semana é independente.
function migrarRotinaParaDatas(rotina){
  const linhaTemDiasAntigo = (rotina.linhas||[]).some(l=>Array.isArray(l.dias));
  const horasEstudoEraArray = Array.isArray(rotina.horasEstudo);
  if(!linhaTemDiasAntigo && !horasEstudoEraArray) return;
  const segundaAtual = segundaDaSemana(0);
  if(!rotina.celulas) rotina.celulas={};
  (rotina.linhas||[]).forEach(l=>{
    if(Array.isArray(l.dias)){
      l.dias.forEach((texto,i)=>{
        if(texto) rotina.celulas[l.id+'|'+fmtDMY(addDias(segundaAtual,i))]=texto;
      });
      delete l.dias;
    }
  });
  if(horasEstudoEraArray){
    const novo={};
    rotina.horasEstudo.forEach((v,i)=>{
      if(v) novo[fmtDMY(addDias(segundaAtual,i))]=v;
    });
    rotina.horasEstudo=novo;
  }
}

// Migra dados antigos (formato de 1 cronograma só) para o novo formato com múltiplos cronogramas
function migrar(data){
  if(data.cronogramas && data.cronogramas.length){
    e = data;
    e.cronogramas.forEach(c=>{
      if(!c.pomodoros) c.pomodoros=[];
      if(!c.titulos) c.titulos={};
      if(!c.questoes) c.questoes=[];
      if(!c.analises) c.analises=[];
      if(c.dataReprogramacao===undefined) c.dataReprogramacao=null;
      if(c.agenda===undefined) c.agenda=null;
      if(!c.agendaConcluidos) c.agendaConcluidos={};
      if(!c.rotina) c.rotina=rotinaPadrao();
      migrarRotinaParaDatas(c.rotina);
    });
    if(!e.aba) e.aba='plano';
    garantirCronogramaPadrao();
    return true;
  }
  if(data.cron){
    const legacy = {
      id: 'cr-legacy',
      nome: 'Cronograma X',
      cron: data.cron || [],
      dias: data.dias || [],
      revs: data.revs || [],
      stats: data.stats || {a:0,d:0,r:0},
      titulos: data.titulos || {},
      dataReprogramacao: data.dataReprogramacao || null,
      questoes: data.questoes || [],
      pomodoros: data.pomodoros || []
    };
    e = { currentCronoId: legacy.id, aba: data.aba || 'plano', cronogramas: [legacy] };
    return true;
  }
  return false;
}

function showSyncStatus(msg, type='info') {
  const colors = {info:'bg-blue-500',success:'bg-green-500',error:'bg-red-500',syncing:'bg-yellow-500'};
  const icons = {info:'☁️',success:'✅',error:'❌',syncing:'🔄'};
  document.getElementById('sync-status').innerHTML = `
    <div class="${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 ${type==='syncing'?'sync-indicator':''}">
      <span>${icons[type]}</span><span class="text-sm font-medium">${msg}</span>
    </div>`;
  if(type!=='syncing') setTimeout(()=>{document.getElementById('sync-status').innerHTML='';},3000);
}

async function saveToCloud() {
  if(!syncEnabled || !userId) return;
  try {
    showSyncStatus('Sincronizando...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    await setDoc(docRef,{...e,lastUpdated:new Date().toISOString()});
    showSyncStatus('Salvo na nuvem!','success');
  } catch(error) {
    console.error('Erro ao salvar:',error);
    showSyncStatus('Erro ao sincronizar','error');
  }
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

async function loadFromCloud() {
  try {
    showSyncStatus('Carregando da nuvem...','syncing');
    const docRef = doc(db,'cronogramas',userId);
    const docSnap = await getDoc(docRef);
    if(docSnap.exists()) {
      const data = docSnap.data();
      if(!migrar(data)) garantirCronogramaPadrao();
      showSyncStatus('Carregado da nuvem!','success');
      // Corrige revisões da mesma sequência que caíram no mesmo dia (ex: 7d e 14d juntas)
      if(ajustarTodasSequencias()) await saveToCloud();
    } else {
      // Primeira vez com esta conta: tenta trazer os dados do ID antigo (login por nome)
      const antigos = await carregarIdAntigo();
      if(!antigos || !migrar(antigos)) garantirCronogramaPadrao();
      await saveToCloud();
    }
    isLoading=false;
    rend();
    setupRealtimeSync();
  } catch(error) {
    console.error('Erro ao carregar:',error);
    showSyncStatus('Erro ao carregar','error');
    ld();
    isLoading=false;
    rend();
  }
}

async function carregarIdAntigo(){
  const sugestao = localStorage.getItem('userId') || '';
  const idAntigo = prompt('Primeiro acesso com este email.\n\nSe você usava o login antigo por nome/ID (ex: Snow), digite-o para importar seus dados. Deixe em branco para começar do zero.', sugestao);
  if(!idAntigo || !idAntigo.trim()) return null;
  try{
    const snap = await getDoc(doc(db,'cronogramas',idAntigo.trim()));
    if(snap.exists()){
      ntf('✅ Dados do ID "'+idAntigo.trim()+'" importados!');
      return snap.data();
    }
    ntf('ID "'+idAntigo.trim()+'" não encontrado. Começando do zero.','warn');
  }catch(err){
    console.error('Erro ao importar ID antigo:',err);
    ntf('Não foi possível ler o ID antigo.','er');
  }
  return null;
}

function setupRealtimeSync() {
  if(unsubSnapshot) unsubSnapshot();
  const docRef = doc(db,'cronogramas',userId);
  unsubSnapshot = onSnapshot(docRef,(snap)=>{
    if(snap.exists()&&!isLoading){
      const data=snap.data();
      const currentUpdate=e.lastUpdated||'';
      const cloudUpdate=data.lastUpdated||'';
      if(cloudUpdate>currentUpdate){
        migrar(data);
        rend();
        ntf('🔄 Atualizado de outro dispositivo!');
      }
    }
  });
}

function sv(){
  saveToCloud();
  try{localStorage.setItem('cron2',JSON.stringify(e))}catch{}
}

function ld(){
  try{
    const s=localStorage.getItem('cron2');
    if(s) migrar(JSON.parse(s));
  }catch{}
  garantirCronogramaPadrao();
}

// ===== CRONOGRAMAS (X, Y, ...) =====

  const nome = prompt('Nome do novo cronograma:', sugestao);
  if(!nome) return;
  const c = novoCronogramaObj(nome);
  e.cronogramas.push(c);
  e.currentCronoId = c.id;
  sv();rend();
  ntf(`📁 ${nome} criado!`);
}
function renomearCronograma(){
  const c = currentC();
  const nome = prompt('Novo nome do cronograma:', c.nome);
  if(!nome) return;
  c.nome = nome; sv();rend();
}
function excluirCronograma(){
  if(e.cronogramas.length<=1){ntf('❌ Mantenha ao menos um cronograma','er');return;}
  if(!confirm(`Excluir "${currentC().nome}" e TODOS os seus dados (matérias, revisões, questões, PDs)? Isso não pode ser desfeito.`)) return;
  e.cronogramas = e.cronogramas.filter(c=>c.id!==e.currentCronoId);
  e.currentCronoId = e.cronogramas[0].id;
  sv();rend();
}
function trocarCronograma(id){
  e.currentCronoId = id;
  rend();
}

// ===== MATÉRIAS (por cronograma) =====
function addMateria(){
  const nomeEl = document.getElementById('nova-materia-nome');
  const aulasEl = document.getElementById('nova-materia-aulas');
  const nome = nomeEl.value.trim();
  const aulas = parseInt(aulasEl.value)||0;
  if(!nome || aulas<=0){ntf('❌ Informe o nome da matéria e a quantidade de aulas','er');return;}
  const c = currentC();
  c.cron.push({id:'m'+Date.now()+Math.random().toString(36).substr(2,4), ma:nome, aulasTotal:aulas, aulasConcluidas:0, concluido:false});
  nomeEl.value=''; aulasEl.value='';
  sv();rend();
  ntf(`✅ ${nome} adicionada ao ${c.nome}!`);
}
function delMateria(id){
  const c = currentC();
  const item = c.cron.find(x=>x.id===id);
  if(!item) return;
  if(!confirm(`Remover "${item.ma}" deste cronograma? O histórico de revisões e questões dessa matéria não será apagado.`)) return;
  c.cron = c.cron.filter(x=>x.id!==id);
  sv();rend();
}

// ===== AGENDA MESCLADA (por cronograma) =====
// Gera um plano dia-a-dia com 2 matérias por dia, priorizando quem tem mais aulas restantes,
// a partir das aulas AINDA NÃO concluídas de cada matéria pendente.
function addDiasISO(iso,n){
  const d=new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtAgendaLabel(iso){
  const d=new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function hojeISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function segundaDeData(d){
  const dia = d.getDay(); // 0=domingo..6=sábado
  const diff = dia===0 ? -6 : 1-dia;
  return addDias(d, diff);
}

// Semana exibida na Agenda (0 = semana atual). Não é salvo — só navegação.
let agendaSemanaOffset = 0;
function mudarSemanaAgenda(delta){ agendaSemanaOffset += delta; rend(); }
function irParaSemanaAtualAgenda(){ agendaSemanaOffset = 0; rend(); }
function offsetDaSemanaDeData(iso){
  const segundaAlvo = segundaDeData(new Date(iso+'T00:00:00'));
  const segundaHoje = segundaDeData(new Date());
  return Math.round((segundaAlvo - segundaHoje) / (7*86400000));
}
function irParaSemanaDaData(iso){
  agendaSemanaOffset = offsetDaSemanaDeData(iso);
  rend();
}
function dmyParaISO(dmy){
  const [d,m,y] = dmy.split('/');
  return `${y}-${m}-${d}`;
}

// Semana exibida em Revisões (0 = semana atual). Não é salvo — só navegação.
let revsSemanaOffset = 0;
function mudarSemanaRevs(delta){ revsSemanaOffset += delta; rend(); }
function irParaSemanaAtualRevs(){ revsSemanaOffset = 0; rend(); }
function irParaSemanaRevsDaData(dmy){
  revsSemanaOffset = offsetDaSemanaDeData(dmyParaISO(dmy));
  rend();
}
function agruparPorData(lista){
  const grupos = [];
  const mapa = {};
  lista.forEach(r=>{
    if(!mapa[r.dr]){ mapa[r.dr] = {dr:r.dr, itens:[]}; grupos.push(mapa[r.dr]); }
    mapa[r.dr].itens.push(r);
  });
  return grupos;
}

// Monta os dias da agenda (2 matérias/dia) a partir de `inicio`, com as aulas ainda não concluídas.
function montarDiasAgenda(pendentes, inicio){
  // Sequência mesclada por peso (Smooth Weighted Round-Robin, o mesmo método
  // usado em balanceadores de carga): a cada escolha, toda matéria pendente
  // acumula seu peso (aulas restantes) e a de maior saldo acumulado é
  // escolhida, que então perde o total de pesos ativos. Isso intercala as
  // matérias ao longo de TODA a agenda — em vez de esgotar as duas maiores
  // primeiro e só depois começar as outras — mantendo as que têm mais aulas
  // aparecendo com mais frequência, de forma bem espaçada.
  const items = pendentes.map(m => ({
    id: m.id, ma: m.ma,
    left: m.aulasTotal - m.aulasConcluidas,
    peso: m.aulasTotal - m.aulasConcluidas,
    atual: 0
  }));

  const sequencia = [];
  while(items.some(it=>it.left>0)){
    const ativos = items.filter(it=>it.left>0);
    const totalPeso = ativos.reduce((s,it)=>s+it.peso,0);
    ativos.forEach(it=>{ it.atual += it.peso; });
    let escolhido = ativos[0];
    ativos.forEach(it=>{ if(it.atual > escolhido.atual) escolhido = it; });
    escolhido.atual -= totalPeso;
    escolhido.left -= 1;
    sequencia.push({id:escolhido.id, ma:escolhido.ma});
  }

  const dias=[];
  for(let i=0;i<sequencia.length;i+=2){
    const date = addDiasISO(inicio, dias.length);
    dias.push({date, materias: sequencia.slice(i, i+2)});
  }
  return dias;
}

function gerarAgenda(){
  const c = currentC();
  const pendentes = c.cron.filter(m=>(m.aulasTotal-m.aulasConcluidas)>0);
  if(pendentes.length===0){ntf('❌ Não há aulas pendentes neste cronograma para gerar agenda','er');return;}
  const inputEl = document.getElementById('agenda-data-inicio');
  const dataInicio = (inputEl && inputEl.value) || hojeISO();
  if(c.agenda && !confirm('Já existe uma agenda gerada para este cronograma. Gerar de novo vai substituí-la (o progresso marcado será perdido). Continuar?\n\nDica: use "Atualizar agenda" para manter o que já foi marcado.')) return;

  const dias = montarDiasAgenda(pendentes, dataInicio);
  c.agenda = {dataInicio, dias};
  c.agendaConcluidos = {};
  agendaSemanaOffset = offsetDaSemanaDeData(dataInicio);
  sv();rend();
  ntf('🗓️ Agenda mesclada gerada!');
}

// Atualiza a agenda existente sem perder o progresso: mantém os dias passados (e hoje, se já
// tiver algo marcado) e refaz daí pra frente com as aulas que faltam — incluindo matérias novas.
function atualizarAgenda(){
  const c = currentC();
  if(!c.agenda){ gerarAgenda(); return; }
  const pendentes = c.cron.filter(m=>(m.aulasTotal-m.aulasConcluidas)>0);
  const hoje = hojeISO();
  const temMarcado = dia => dia.materias.some(m=>c.agendaConcluidos[dia.date+'|'+m.id]);

  const mantidos = c.agenda.dias.filter(dia => dia.date < hoje || (dia.date===hoje && temMarcado(dia)));
  const inicio = mantidos.some(dia=>dia.date===hoje) ? addDiasISO(hoje,1) : hoje;
  const novos = pendentes.length ? montarDiasAgenda(pendentes, inicio) : [];

  // Guarda só as marcações dos dias mantidos
  const concluidos = {};
  mantidos.forEach(dia=>dia.materias.forEach(m=>{
    const key = dia.date+'|'+m.id;
    if(c.agendaConcluidos[key]) concluidos[key] = true;
  }));

  c.agenda = {dataInicio: c.agenda.dataInicio, dias: [...mantidos, ...novos]};
  c.agendaConcluidos = concluidos;
  agendaSemanaOffset = 0;
  sv();rend();
  ntf(novos.length
    ? `🔄 Agenda atualizada! ${novos.length} dias a partir de ${fmtDMY(new Date(inicio+'T00:00:00'))}, progresso mantido.`
    : '🎉 Todas as aulas já foram concluídas!');
}

// ===== ROTINA SEMANAL =====
// Grade dia x horário (estilo planilha), com células de texto livre editadas
// à mão. As linhas de Revisões e Questões, ao final, puxam dados reais do
// app: revisões pendentes dos próximos 7 dias — e Questões usa exatamente a
// mesma frequência (mesmos dias) que Revisões, como lembrete pra praticar.
function chaveCelulaRotina(linhaId, dataLabel){ return linhaId+'|'+dataLabel; }

function salvarRotinaCelula(linhaId, dataLabel, valor){
  const c = currentC();
  const chave = chaveCelulaRotina(linhaId, dataLabel);
  if(valor) c.rotina.celulas[chave] = valor;
  else delete c.rotina.celulas[chave];
  sv();
}

function salvarHorarioLinha(linhaId, valor){
  const c = currentC();
  const linha = c.rotina.linhas.find(l=>l.id===linhaId);
  if(!linha) return;
  linha.horario = valor;
  sv();
}

function salvarHorasEstudoRotina(dataLabel, valor){
  const c = currentC();
  if(valor) c.rotina.horasEstudo[dataLabel] = valor;
  else delete c.rotina.horasEstudo[dataLabel];
  sv();
}

function addLinhaRotina(){
  const c = currentC();
  c.rotina.linhas.push({ id:'rl'+Math.random().toString(36).substr(2,6), horario:'' });
  sv();rend();
}

function removerLinhaRotina(linhaId){
  const c = currentC();
  c.rotina.linhas = c.rotina.linhas.filter(l=>l.id!==linhaId);
  Object.keys(c.rotina.celulas).forEach(k=>{ if(k.startsWith(linhaId+'|')) delete c.rotina.celulas[k]; });
  sv();rend();
}

// Semana exibida na Rotina (0 = semana atual, +1 = próxima, -1 = anterior).
// Não é salvo — é só navegação, volta pra semana atual ao recarregar.
let rotinaSemanaOffset = 0;

function segundaDaSemana(offset){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diaSemana = hoje.getDay(); // 0=domingo..6=sábado
  const diffSegunda = diaSemana===0 ? -6 : 1-diaSemana; // volta até a segunda desta semana
  return addDias(hoje, diffSegunda + offset*7);
}

function mudarSemanaRotina(delta){

// Helpers de data
function parseDMY(s){const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);}
function fmtDMY(d){return d.toLocaleDateString('pt-BR');}
function addDias(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

// Sequência das revisões: `dias` = distância da 1ª revisão
const INTERVALOS_REV=[
  {t:'7d',  dias:0,  cor:'amber'},
  {t:'14d', dias:7,  cor:'orange'},
  {t:'30d', dias:23, cor:'purple'},
  {t:'60d', dias:53, cor:'blue'}
];
const MAX_REVS_DIA=2;

// Primeiro dia a partir de `d` com menos de MAX_REVS_DIA revisões pendentes (ignorando `ignorarId`)
function primeiroDiaLivre(c, d, ignorarId){
  const cnt={};
  c.revs.filter(r=>r.s==='p' && r.id!==ignorarId).forEach(r=>{cnt[r.dr]=(cnt[r.dr]||0)+1;});
  for(let i=0;i<365;i++){
    if((cnt[fmtDMY(d)]||0)<MAX_REVS_DIA) return d;
    d=addDias(d,1);
  }
  return d;
}

// Garante que cada revisão de um mesmo estudo (7d → 14d → 30d → 60d) caia depois da anterior,
// mantendo o intervalo entre elas. Corrige casos em que o limite de 2/dia ou uma edição de data
// jogou duas revisões no mesmo dia. Retorna true se mudou alguma data.
function ajustarSequenciaRevs(c, di){
  const ordem = t => INTERVALOS_REV.findIndex(x=>x.t===t);
  const revs = c.revs.filter(r=>r.di===di && ordem(r.t)>=0).sort((a,b)=>ordem(a.t)-ordem(b.t));
  let mudou=false;
  for(let i=1;i<revs.length;i++){
    const ant=revs[i-1], r=revs[i];
    if(r.s!=='p') continue;
    const gap = INTERVALOS_REV[ordem(r.t)].dias - INTERVALOS_REV[ordem(ant.t)].dias;
    const minimo = addDias(parseDMY(ant.dr), gap);
    if(parseDMY(r.dr) < minimo){
      r.dr = fmtDMY(primeiroDiaLivre(c, minimo, r.id));
      mudou=true;
    }
  }
  return mudou;
}

function ajustarTodasSequencias(){
  let mudou=false;
  (e.cronogramas||[]).forEach(c=>{
    [...new Set((c.revs||[]).map(r=>r.di))].forEach(di=>{ if(ajustarSequenciaRevs(c,di)) mudou=true; });
  });
  return mudou;
}

// Gera as 4 revisões respeitando máx 2/dia, a partir da data escolhida pelo usuário
function gerarRevisoes(dsId, ma, de, ate, qtd, data1, notas=''){
  const c = currentC();
  const cnt={};
  c.revs.filter(r=>r.s==='p').forEach(r=>{cnt[r.dr]=(cnt[r.dr]||0)+1;});
  let anterior=null; // {data, dias} da revisão anterior desta sequência

  INTERVALOS_REV.forEach(({t,dias,cor})=>{
    let d=addDias(data1,dias);
    // se a anterior foi empurrada pelo limite diário, empurra esta também (mantém o intervalo)
    if(anterior){
      const minimo=addDias(anterior.data, dias-anterior.dias);
      if(d<minimo) d=minimo;
    }
    for(let i=0;i<365;i++){
      const k=fmtDMY(d);
      if((cnt[k]||0)<2){
        cnt[k]=(cnt[k]||0)+1;
        c.revs.push({
          id:`${dsId}-${t}-${Math.random().toString(36).substr(2,4)}`,
          di:dsId,ma,i:de,f:ate,q:qtd,titulo:notas,dr:k,t,s:'p',cor
        });
        anterior={data:d,dias};
        break;
      }
      d=addDias(d,1);
    }
  });
}

    document.getElementById('modal-root').innerHTML = '';
    rend();
  };

  document.getElementById('ia-analisar').onclick = async () => {
    const questao = document.getElementById('ia-questao').value.trim();
    const resposta = document.getElementById('ia-resposta').value.trim();
    const gabarito = document.getElementById('ia-gabarito').value.trim();
    if(!questao){ntf('❌ Cole o enunciado da questão','er');return;}

    const btn = document.getElementById('ia-analisar');
    const out = document.getElementById('ia-resultado');
    btn.disabled = true; btn.textContent = 'Analisando...';
    out.innerHTML = '<p class="text-sm text-gray-500">🤖 Analisando a questão...</p>';

    try{
      const token = await auth.currentUser.getIdToken();
      const r = await fetch('/api/analisar',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body: JSON.stringify({materia:ma,questao,resposta,gabarito})
      });
      const dados = await r.json().catch(()=>({erro:'Resposta inválida do servidor.'}));
      if(!r.ok) throw new Error(dados.erro||('Erro '+r.status));

      out.innerHTML = `
        <div class="bg-purple-50 border-2 border-purple-200 rounded-xl p-4 text-sm space-y-2">
          <p><span class="font-bold text-purple-700">📍 Reforce:</span> ${escHtml(dados.assunto)}</p>
          <p><span class="font-bold text-red-600">❌ Por que errou:</span> ${escHtml(dados.motivo_erro)}</p>
          <div><span class="font-bold text-green-700">📚 Revisar:</span>
            <ul class="list-disc ml-5 mt-1">${(dados.revisar||[]).map(t=>`<li>${escHtml(t)}</li>`).join('')}</ul>
          </div>
        </div>`;

      const hoje = new Date();
      const c = currentC();
      if(!c.analises) c.analises=[];
      c.analises.push({
        id: Date.now(), ma,
        data: String(hoje.getDate()).padStart(2,'0')+'/'+String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear(),
        assunto: dados.assunto, motivo_erro: dados.motivo_erro, revisar: dados.revisar||[],
        questao: questao.slice(0,2000)
      });
      sv();
      document.getElementById('ia-historico').innerHTML = analisesHtml(ma);
      ['ia-questao','ia-resposta','ia-gabarito'].forEach(id=>document.getElementById(id).value='');
    }catch(err){
      out.innerHTML = `<div class="bg-red-50 text-red-700 rounded-lg p-3 text-sm">❌ ${escHtml(err.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = 'Analisar';
    }
  };
}

  for(let i=n-1;i>=0;i--) arr.push(fmtDMY(addDias(hoje,-i)));
  return arr;
}

// acertos/erros: registros antigos podem não ter "acertos" salvo (undefined) —
// esses são ignorados no cálculo de aproveitamento em vez de contar como erro.
function questoesDesempenho(lista){
  const comDados = lista.filter(q=>typeof q.acertos==='number');
  const qtd = comDados.reduce((s,q)=>s+q.qtd,0);
  const acertos = comDados.reduce((s,q)=>s+q.acertos,0);
  const erros = qtd-acertos;
  const pct = qtd>0 ? Math.round((acertos/qtd)*100) : null;
  return {qtd,acertos,erros,pct};
}
function desempenhoBadge(pct){

  if(pct>=70) return {hex:'#0ca30c',rotulo:'🟢 Indo bem!'};
  if(pct>=50) return {hex:'#fab219',rotulo:'🟡 Atenção, pode melhorar'};
  return {hex:'#d03b3b',rotulo:'🔴 Precisa reforçar essa matéria'};
}

// ===== PDs / POMODORO (por cronograma) =====
// Fases: idle -> estudo -> aguardando -> (extra -> pausa) | pausa -> idle
// "aguardando" é a pausa de decisão logo após os 25min: o usuário escolhe
// continuar estudando a mesma matéria (fase "extra", contando os minutos a mais
// até ele parar) ou já ir pra pausa de 5min.
// O cronometro se baseia no horario real (timestamps), nao em contagem de ticks:
// isso evita que o tempo fique errado quando a aba fica em segundo plano
// (navegadores reduzem a frequencia do setInterval) e permite retomar
// corretamente apos um reload/troca de aba, guardando o estado no localStorage.
const POMO_DURACAO = 25*60;
const POMO_PAUSA_DURACAO = 5*60;
const POMO_STORAGE_KEY = 'pomoState';
let pomoEstado = 'idle'; // idle | estudo | aguardando | extra | pausa
let pomoSegundos = POMO_DURACAO;
let pomoRodando = false;
let pomoIntervalId = null;
let pomoAudioCtx = null;
let pomoFimEm = null;           // contagem regressiva (estudo/pausa)
let pomoExtraInicioEm = null;   // contagem progressiva (extra) - inicio do trecho em execucao, null se pausado
let pomoExtraAcumulado = 0;     // segundos acumulados de trechos anteriores do extra
let pomoCronoId = null;
let pomoRegistroAtualId = null; // id do registro em pomodoros[] que recebe os minutos extras

function pomoFmt(s){
  const m=Math.floor(s/60).toString().padStart(2,'0');
  const ss=(s%60).toString().padStart(2,'0');
  return `${m}:${ss}`;
}
function pomoAudioUnlock(){
  try{
    if(!pomoAudioCtx) pomoAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(pomoAudioCtx.state==='suspended') pomoAudioCtx.resume();
  }catch(err){}
}
function pomoAlarme(){
  try{
    if(!pomoAudioCtx) pomoAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = pomoAudioCtx;
    const tocar=(t,freq)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      gain.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime+t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.4);
    };
    tocar(0,880); tocar(0.45,880); tocar(0.9,1175);
  }catch(err){}
}
function pomoSalvarEstado(){
  try{
    if((pomoEstado==='estudo'||pomoEstado==='pausa') && pomoRodando && pomoFimEm){
      localStorage.setItem(POMO_STORAGE_KEY, JSON.stringify({estado:pomoEstado, fimEm:pomoFimEm, cronoId:pomoCronoId}));
    } else if(pomoEstado==='extra'){
      localStorage.setItem(POMO_STORAGE_KEY, JSON.stringify({estado:'extra', cronoId:pomoCronoId, registroId:pomoRegistroAtualId, rodando:pomoRodando, inicioEm:pomoExtraInicioEm, acumulado:pomoExtraAcumulado}));
    } else {
      localStorage.removeItem(POMO_STORAGE_KEY);
    }
  }catch(err){}
}
function pomoCreditarPD(min){
  const cron = e.cronogramas.find(c=>c.id===pomoCronoId) || currentC();
  const registro = {id:Date.now(), data: new Date().toLocaleDateString('pt-BR'), min};
  cron.pomodoros.push(registro);
  sv();
  return registro.id;
}
function pomoAdicionarMinutosExtras(min){
  if(min<=0) return;
  const cron = e.cronogramas.find(c=>c.id===pomoCronoId) || currentC();
  const registro = cron.pomodoros.find(p=>p.id===pomoRegistroAtualId);
  if(registro){
    registro.min = (registro.min||25) + min;
  } else {
    cron.pomodoros.push({id:Date.now(), data: new Date().toLocaleDateString('pt-BR'), min});
  }
  sv();
}
function pomoRestaurarEstado(){
  try{
    const raw = localStorage.getItem(POMO_STORAGE_KEY);
    if(!raw) return;
    const st = JSON.parse(raw);
    if(!st || !st.estado) return;
    pomoCronoId = st.cronoId;

    if(st.estado==='extra'){
      pomoEstado = 'extra';
      pomoRegistroAtualId = st.registroId;
      pomoExtraAcumulado = st.acumulado||0;
      if(st.rodando && st.inicioEm){
        pomoExtraInicioEm = st.inicioEm;
        pomoRodando = true;
        pomoIntervalId = setInterval(pomoTick,1000);
      } else {
        pomoExtraInicioEm = null;
        pomoRodando = false;
      }
      ntf('🍅 Sessão de estudo extra retomada.');
      rend();
      return;
    }

    if(!st.fimEm) return;
    let estado = st.estado;
    let fimEm = st.fimEm;
    let restante = fimEm - Date.now();
    let seguirRodando = true;
    // processa a fase que ja terminou enquanto a aba estava em segundo plano/fechada
    if(restante<=0){
      seguirRodando = false;
      if(estado==='estudo'){
        pomoRegistroAtualId = pomoCreditarPD(25);
        estado = 'aguardando';
      }
    }
    if(seguirRodando){
      pomoEstado = estado;
      pomoRodando = true;
      pomoFimEm = fimEm;
      pomoSegundos = Math.max(0, Math.round(restante/1000));
      pomoIntervalId = setInterval(pomoTick,1000);
      ntf('🍅 Contagem retomada.');
    } else if(estado==='aguardando'){
      pomoEstado='aguardando';
      pomoRodando=false;
      pomoFimEm=null;
      pomoSegundos=POMO_DURACAO;
      localStorage.removeItem(POMO_STORAGE_KEY);
      ntf('🍅 PD concluído enquanto você estava fora! Continue estudando ou faça uma pausa.');
    } else {
      pomoEstado='idle';
      pomoRodando=false;
      pomoFimEm=null;
      pomoSegundos=POMO_DURACAO;
      pomoRegistroAtualId=null;
      localStorage.removeItem(POMO_STORAGE_KEY);
      ntf('☕ Pausa concluída enquanto você estava fora. Pronto para o próximo PD.');
    }
    rend();
  }catch(err){}
}
function pomoToggle(){
  if(pomoEstado==='idle'){
    pomoAudioUnlock();
    pomoCronoId = currentC().id;
    pomoEstado = 'estudo';
    pomoRodando = true;
    pomoFimEm = Date.now() + pomoSegundos*1000;
    pomoIntervalId = setInterval(pomoTick,1000);
    pomoSalvarEstado();
    rend();
    return;
  }
  if(pomoEstado==='estudo' || pomoEstado==='pausa'){
    if(pomoRodando){
      pomoRodando=false; clearInterval(pomoIntervalId);
      pomoFimEm = null;
    } else {
      pomoAudioUnlock();
      pomoRodando=true;
      pomoFimEm = Date.now() + pomoSegundos*1000;
      pomoIntervalId = setInterval(pomoTick,1000);
    }
    pomoSalvarEstado();
    rend();
    return;
  }
  if(pomoEstado==='extra'){
    if(pomoRodando){
      pomoExtraAcumulado += Math.floor((Date.now()-pomoExtraInicioEm)/1000);
      pomoExtraInicioEm = null;
      pomoRodando = false;
      clearInterval(pomoIntervalId);
    } else {
      pomoAudioUnlock();
      pomoExtraInicioEm = Date.now();
      pomoRodando = true;
      pomoIntervalId = setInterval(pomoTick,1000);
    }
    pomoSalvarEstado();
    rend();
    return;
  }
}
function pomoTick(){
  if(pomoEstado==='estudo' || pomoEstado==='pausa'){
    if(!pomoFimEm) return;
    pomoSegundos = Math.max(0, Math.round((pomoFimEm - Date.now())/1000));
    const disp = document.getElementById('pomo-display');
    if(disp) disp.textContent = pomoFmt(pomoSegundos);
    if(pomoSegundos<=0){
      clearInterval(pomoIntervalId);
      pomoAlarme();
      if(pomoEstado==='estudo'){
        pomoRegistroAtualId = pomoCreditarPD(25);
        ntf('🍅 PD concluído! Continue estudando ou faça uma pausa.');
        pomoEstado = 'aguardando';
        pomoRodando = false;
        pomoFimEm = null;
        pomoSegundos = POMO_DURACAO;
      } else {
        ntf('☕ Pausa concluída! Pronto para o próximo PD.');
        pomoEstado = 'idle';
        pomoRodando = false;
        pomoFimEm = null;
        pomoSegundos = POMO_DURACAO;
        pomoRegistroAtualId = null;
      }
      pomoSalvarEstado();
      rend();
    }
    return;
  }
  if(pomoEstado==='extra'){
    if(!pomoExtraInicioEm) return;
    const elapsed = pomoExtraAcumulado + Math.floor((Date.now()-pomoExtraInicioEm)/1000);
    const disp = document.getElementById('pomo-display');
    if(disp) disp.textContent = pomoFmt(elapsed);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && pomoRodando) pomoTick();
});
function pomoContinuarEstudando(){
  pomoAudioUnlock();
  pomoEstado = 'extra';
  pomoExtraAcumulado = 0;
  pomoExtraInicioEm = Date.now();
  pomoRodando = true;
  pomoIntervalId = setInterval(pomoTick,1000);
  pomoSalvarEstado();
  rend();
}
function pomoIniciarPausa(){
  pomoAudioUnlock();
  pomoEstado = 'pausa';
  pomoRodando = true;
  pomoFimEm = Date.now() + POMO_PAUSA_DURACAO*1000;
  pomoSegundos = POMO_PAUSA_DURACAO;
  pomoIntervalId = setInterval(pomoTick,1000);
  pomoSalvarEstado();
  rend();
}
function pomoPararExtra(){
  clearInterval(pomoIntervalId);
  const totalSegundos = pomoExtraAcumulado + (pomoRodando && pomoExtraInicioEm ? Math.floor((Date.now()-pomoExtraInicioEm)/1000) : 0);
  const minutosExtras = Math.round(totalSegundos/60);
  pomoAdicionarMinutosExtras(minutosExtras);
  ntf(`✅ +${minutosExtras} minuto(s) extra registrados nesse PD!`);
  pomoExtraInicioEm = null;
  pomoExtraAcumulado = 0;
  pomoRodando = false;
  pomoIniciarPausa();
}
function pomoPularPausa(){
  pomoRodando=false; clearInterval(pomoIntervalId);
  pomoEstado = 'idle';
  pomoFimEm=null;
  pomoSegundos = POMO_DURACAO;
  pomoRegistroAtualId = null;
  pomoSalvarEstado();
  rend();
}
function pomoReset(){
  pomoRodando=false; clearInterval(pomoIntervalId);
  pomoEstado = 'idle';
  pomoFimEm=null;
  pomoExtraInicioEm=null;
  pomoExtraAcumulado=0;
  pomoSegundos = POMO_DURACAO;

}

// PDs contados pelo tempo estudado: cada 25min = 1 PD, então os minutos extras
// de "Continuar estudando" viram fração de PD (ex.: 3 PDs + 10min = 3,4 PDs).
function pdsDe(lista){
  return Math.round(lista.reduce((s,p)=>s+(p.min||25),0)/(POMO_DURACAO/60)*10)/10;
}
function fmtPD(v){ return String(v).replace('.',','); }
function pomodorosPorDia(n=14){
  const dias=diasAtras(n);
  const pds=currentC().pomodoros;
  return dias.map(d=>{
    const qtd=pdsDe(pds.filter(p=>p.data===d));
    return {data:d,qtd,rotulo:fmtPD(qtd)};
  });
}
function pomodorosHoje(){
  const hj=fmtDMY(new Date());
  return fmtPD(pdsDe(currentC().pomodoros.filter(p=>p.data===hj)));
}
function pomodorosSemana(){
  const dias=diasAtras(7);
  return fmtPD(pdsDe(currentC().pomodoros.filter(p=>dias.includes(p.data))));
}
function pomodorosTotal(){
  return fmtPD(pdsDe(currentC().pomodoros));
}
function minutosSemana(){
  const dias=diasAtras(7);
  return currentC().pomodoros.filter(p=>dias.includes(p.data)).reduce((s,p)=>s+(p.min||25),0);
}

// Gráfico de barras (SVG) genérico
function svgBarChart(dados, color){
  const max=Math.max(...dados.map(d=>d.qtd),1);
  const w=760,h=190,padB=34,padT=20,padL=10,padR=10;
  const areaW=w-padL-padR;
  const bw=areaW/dados.length;
  const bars=dados.map((d,i)=>{
    const bh=max>0?(d.qtd/max)*(h-padT-padB):0;
    const x=padL+i*bw+bw*0.15;
    const bwReal=bw*0.7;
    const y=h-padB-bh;
    const [dd,mm]=d.data.split('/');
    const fill=typeof color==='function'?color(d.qtd):color;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwReal.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${fill}"/>
    ${d.qtd>0?`<text x="${(x+bwReal/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="#374151" font-weight="bold">${d.rotulo??d.qtd}</text>`:''}
    <text x="${(x+bwReal/2).toFixed(1)}" y="${h-padB+14}" font-size="9" text-anchor="middle" fill="#6b7280">${dd}/${mm}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#e5e7eb"/>
    ${bars}
  </svg>`;
}
function svgChartDias(n=14){ return svgBarChart(questoesPorDia(n), '#7c3aed'); }
// cor da barra pela meta diária: <4 PDs vermelho, 4 a 6 amarelo, 6+ verde
function corPDsDia(qtd){ return qtd>=6?'#0ca30c':qtd>=4?'#fab219':'#d03b3b'; }
function svgChartPomodoros(n=14){ return svgBarChart(pomodorosPorDia(n), corPDsDia); }
